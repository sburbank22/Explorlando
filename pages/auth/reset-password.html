<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Explorlando | Reset Password</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body class="reset-password-page">

    <div class="reset-password-container">
        <div class="reset-password-card">
            <h2>Reset Password</h2>
            <p class="reset-password-subtext">
                Enter your new password below and confirm it to update your account.
            </p>

            <form id="resetForm" class="reset-password-form">

                <div class="password-field">
                    <input type="password" id="password" placeholder="New Password" required>
                </div>

                <div class="password-field">
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                </div>

                <div class="show-password-toggle">
                    <input type="checkbox" id="showPassword">
                    <label for="showPassword">Show Password</label>
                </div>

                <button type="submit">Reset Password</button>
            </form>

            <p id="message" class="reset-password-message"></p>

            <div class="reset-password-links">
                <a href="login.html">Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");

        const passwordInput = document.getElementById("password");
        const confirmInput = document.getElementById("confirmPassword");
        const toggle = document.getElementById("showPassword");

        toggle.addEventListener("change", function () {
            const type = this.checked ? "text" : "password";
            passwordInput.type = type;
            confirmInput.type = type;
        });

        document.getElementById("resetForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const password = document.getElementById("password").value;
            const confirm = document.getElementById("confirmPassword").value;
            const message = document.getElementById("message");

            if (password !== confirm) {
                message.innerText = "Passwords do not match";
                return;
            }

            const res = await fetch("/api/auth/resetPassword.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    token: token,
                    new_password: password
                })
            });

            const data = await res.json();

            message.innerText = data.message;

            // this resets classes first
            message.className = "reset-password-message";

            if (data.message === "Password reset successful") {
                message.classList.add("success");
            } else {
                message.classList.add("error");
            }
        });
    </script>

</body>

</html>
