<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title> Local Attractions </title>
  <link rel="stylesheet" href="../../css/style.css">

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f2f2f2;
    }


    /*  Buttons  */
    .btn {
      background: #ff9f1c;
      padding: 5px 40px;
      border-radius: 40px;
      font-size: 22px;

      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.25);
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      color: black;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;

    }

    /*  Main  */
    .main {
      flex: 1;
      padding: 20px 40px;
      background: white;
      position: relative;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: #e0e0e0;
      border-radius: 30px;
      padding: 10px 20px;
      flex: 1;
    }

    .search-box input {
      border: none;
      background: transparent;
      font-size: 18px;
      width: 100%;
      outline: none;
    }

    .search-btn {
      background: #f9b158;
      ;
      border: none;
      border-radius: 30px;
      padding: 12px 30px;
      font-size: 20px;
      cursor: pointer;
    }

    .search-btn:hover {
      background: #f0aa48;
    }

    /* Featured section */
    .featured {
      text-align: center;
      margin: 30px 0;
    }

    .featured span {
      background: #8fd39a;
      padding: 10px 50px;
      border-radius: 30px;
      font-size: 32px;
    }

    /*  Cards section */
    .cards {
      display: flex;
      gap: 30px;
      justify-content: center;
    }

    .card {
      background: #e0e0e0;
      border-radius: 30px;
      width: 230px;
      padding: 15px;
      text-align: center;
    }

    .card img {
      width: 100%;
      border-radius: 20px;
      height: 160px;
      object-fit: cover;
    }

    .card h3 {
      margin: 10px 0 5px;
    }

    .card p {
      font-size: 14px;
    }

    .attractions-toolbar {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .filter-btn:hover {
      background: #d6d6d6;
    }

    .filter {
      position: relative;
    }

    .filter-btn {
      background: #e0e0e0;
      border: none;
      border-radius: 30px;
      padding: 12px 30px;
      cursor: pointer;
      font-size: 16px;
    }

    .filter-btn:hover {
      background: #d4d4d4;
    }

    .filter-menu {
      display: none;
      position: absolute;
      top: 55px;
      left: 0;
      background: #e0e0e0;
      padding: 16px;
      border-radius: 16px;
      width: 240px;
      z-index: 1000;
    }

    .filter-menu.show {
      display: block;
    }

    .filter-section {
      margin-bottom: 14px;
    }

    .filter-section label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .filter-section select {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
    }

    .apply-btn {
      width: 100%;
      border: none;
      border-radius: 20px;
      padding: 10px;
      background: #ffb655;
      cursor: pointer;
      font-weight: bold;
    }

    .apply-btn:hover {
      background: #f0aa48;
    }

    .cards {
      display: flex;
      gap: 30px;
      justify-content: center;
      margin-top: 90px;
    }
  </style>
</head>

<body>

  <header class="top-bar">
    <a class="logo" href="../home/home.html">
      <img src="../../images/Explorlando-Logo.PNG" alt="Explorlando logo">
    </a>

    <form class="top-search" role="search">
      <input type="search" placeholder="Search..." aria-label="Search Explorlando">
    </form>

    <a href="../profile/profile.html" class="account-btn">
      <img src="../../images/user-1.png" alt="Account icon">
      <span>My Account</span>
    </a>
  </header>

  <!-- Main Layout -->
  <!-- Sidebar -->
  <div class="app-layout">
    <nav class="side-nav">
      <a class="nav-item" href="../auth/login.html">Login</a>
      <a class="nav-item" href="../profile/profile.html">Profile</a>
      <a class="nav-item" href="../about.html">About Us</a>
      <a class="nav-item active" href="index.html">Attractions</a>
      <a class="nav-item" href="../open-lobby/index.html">Open Lobby</a>
      <a class="nav-item" href="../spotlight/spotlight.html">Explorlando Spotlight</a>
      <a class="nav-item" href="../for-business/index.html">For Businesses</a>
      <a class="nav-item" href="../profile/settings.html">Settings</a>
    </nav>

    <!-- Main section -->
    <div class="main">
      <div class="attractions-toolbar">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search Attractions">
        </div>

        <!-- Filter Section -->
        <div class="filter">
          <button class="filter-btn" id="filterToggle" type="button">Filters ▾</button>


          <div class="filter-menu" id="filterMenu">
            <div class="filter-section">
              <label for="typeFilter">Attraction Type</label>
              <select id="typeFilter">
                <option value="all">All</option>
                <option value="Wildlife">Wildlife</option>
                <option value="Outdoors">Outdoors</option>
                <option value="Dining">Dining</option>
              </select>
            </div>

            <div class="filter-section">
              <label for="priceFilter">Price Range</label>
              <select id="priceFilter">
                <option value="all">All</option>
                <option value="$">$</option>
                <option value="$$">$$</option>
                <option value="$$$">$$$</option>
              </select>
            </div>

            <button class="apply-btn" id="clearFilters" type="button">Clear Filters</button>
          </div>
        </div>

        <button class="search-btn">Search</button>
      </div>

      <!-- Featured section -->
      <div class="cards">
        <div class="card" data-type="Wildlife" data-price="$$">
          <h3>Baby Joeys Alligator Farm</h3>
          <a href="alligator-farm.html">
            <img src="../../images/alligator.jpg" alt="">
          </a>
        </div>

        <div class="card" data-type="Outdoors" data-price="$">
          <h3>Orange Grove Mini Golf</h3>
          <a href="orange-grove-mini-golf.html">
            <img src="../../images/golf.jpg" alt="">
          </a>
        </div>

        <div class="card" data-type="Dining" data-price="$$$">
          <h3>Skyline Rooftop Lounge</h3>
          <a href="skyline-rooftop.html">
            <img src="../../images/rooftop.jpg" alt="">
          </a>
        </div>

        <div class="card" data-type="Outdoors" data-price="$">
          <h3>Winter Town Botanical Trails</h3>
          <a href="wintertown-botanical-garden.html">
            <img src="../../images/botanical.jpg" alt="">
          </a>
        </div>
      </div>

      <script>
        const filterToggle = document.getElementById("filterToggle");
        const filterMenu = document.getElementById("filterMenu");
        const typeFilter = document.getElementById("typeFilter");
        const priceFilter = document.getElementById("priceFilter");
        const clearFilters = document.getElementById("clearFilters");
        const searchInput = document.getElementById("searchInput");

        filterToggle.addEventListener("click", function (e) {
          e.stopPropagation();
          filterMenu.classList.toggle("show");
        });

        filterMenu.addEventListener("click", function (e) {
          e.stopPropagation();
        });

        document.addEventListener("click", function () {
          filterMenu.classList.remove("show");
        });

        function applyFilters() {
          const searchValue = searchInput.value.toLowerCase().trim();
          const selectedType = typeFilter.value;
          const selectedPrice = priceFilter.value;
          const cards = document.querySelectorAll(".card");

          cards.forEach(function (card) {
            const title = card.querySelector("h3").textContent.toLowerCase();
            const cardType = card.dataset.type;
            const cardPrice = card.dataset.price;

            const matchesSearch = title.includes(searchValue);
            const matchesType = selectedType === "all" || cardType === selectedType;
            const matchesPrice = selectedPrice === "all" || cardPrice === selectedPrice;

            if (matchesSearch && matchesType && matchesPrice) {
              card.style.display = "";
            } else {
              card.style.display = "none";
            }
          });
        }

        searchInput.addEventListener("input", applyFilters);
        typeFilter.addEventListener("change", applyFilters);
        priceFilter.addEventListener("change", applyFilters);

        clearFilters.addEventListener("click", function () {
          typeFilter.value = "all";
          priceFilter.value = "all";
          searchInput.value = "";
          applyFilters();
        });
      </script>

      <script>
        fetch('/api/attractions/getAttractions.php')
          .then(function (response) {
            if (!response.ok) {
              throw new Error('Network error: ' + response.status);
            }
            return response.json();
          })
          .then(function (json) {
            if (json.status !== 'success') {
              console.error('Attractions API error:', json.message);
              return;
            }

            var cards = document.querySelectorAll('.card');
            var attractions = json.data;

            cards.forEach(function (card) {
              var title = card.querySelector('h3').textContent.trim();

              var attraction = attractions.find(function (a) {
                if (title === 'Baby Joeys Alligator Farm') return a.name === 'Alligator Farm';
                if (title === 'Orange Grove Mini Golf') return a.name === 'Orange Grove Mini Golf';
                if (title === 'Skyline Rooftop Lounge') return a.name === 'Skyline';
                if (title === 'Winter Town Botanical Trails') return a.name === 'Winter Town';
                return false;
              });

              if (!attraction) return;

              var img = card.querySelector('img');
              if (img) {
                img.src = attraction.image_url;
                img.alt = attraction.name;
              }
            });
          })
          .catch(function (error) {
            console.error('Failed to load attractions:', error);
          });
      </script>

      <script src="../../js/script.js"></script>

</body>

</html>
