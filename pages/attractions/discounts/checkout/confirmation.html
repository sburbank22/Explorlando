<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Confirmation</title>

    <style>
        body {
            font-family: Arial;
            background: #ffffff;
            margin: 0;
            padding: 0;
        }



        .container {
            width: 700px;
            margin: 40px auto;
            background: #31C3C9;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            height: 1800px;
        }

        h2 {
            text-align: center;
        }

        h3 {
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #BAD67F;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }

        .review {
            background: rgb(255, 255, 255);
            padding: 15px;
            border-radius: 5px;
        }

        .discount-info {
            font-size: 14px;
            color: black;
        }

        /* ---The top Navigation Bar----- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #BAD67F;
            padding: 10px 30px;
        }

        .logo {
            margin-left: -19px;
        }

        .logo img {
            height: 100px;
            width: auto;
            display: block;
            border-radius: 10px;
        }

        /* -----My Account Button----- */
        .account-btn {
            display: flex;
            align-items: center;
            gap: 2px;
            background-color: #f4b942;
            padding: 0 20px;
            height: 40px;
            border-radius: 999px;

            text-decoration: none;
            color: #000;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.2s ease;
            flex-shrink: 0;
        }

        /* ---My Account button Icon---- */
        .account-btn img {
            height: 40px;
            width: auto;
            object-fit: contain;
            display: block;
            transform: translateX(-6px);
        }

        .account-btn span {
            margin-left: -25px;
        }

        .account-btn:hover {
            background-color: #cfa13f;
        }

        /* ----App Layout wrapper for pages with a sidebar----- */
        .app-layout {
            display: flex;
            min-height: calc(100vh - 70px);
        }

        /* ---Left sidebar navigation--- */
        .side-nav {
            width: 200px;
            background-color: #BAD67F;
            padding: 24px 12px;
            box-sizing: border-box;

            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* ---Nav sidebar links--- */
        .nav-item {
            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
            text-decoration: none;
            color: #000000;
            font-weight: 600;
            font-size: 14px;

            padding: 10px 10px;
            border-radius: 14px;
            white-space: nowrap;
        }


        /* ---Nav Sidebar hover + active state--- */
        .nav-item:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .nav-item.active {
            background: rgba(255, 255, 255, 0.26);
            font-weight: 700;
        }


        /* ---Main content area next to sidebar--- */
        .app-layout>main {
            flex: 1;
        }

        /* Search bar stuff */
        /* Top header search bar (shared) */
        .top-bar {
            gap: 16px;
        }

        .top-search {
            flex: 1;
            display: flex;
            justify-content: left;
        }

        .top-search input {
            width: 100%;
            max-width: 520px;
            height: 38px;
            border-radius: 6px;
            border: 1px solid rgba(0, 0, 0, 0.2);
            padding: 0 12px;
            outline: none;
        }

        .top-search input:focus {
            border-color: #6b7676;
        }

        .container {
            background: white;
            padding: 20px 40px;
            width: 100%;

        }

        .confirmation-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;

            /* Background styling */
            background: linear-gradient(135deg, #fbfbfb, #f4ffe6);
            padding: 40px;
        }

        /* Improve the box look */
        .box {
            background: white;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
    </style>

    <script>
        function getParams() {
            const params = new URLSearchParams(window.location.search);

            let email = params.get("email");
            let total = params.get("total");

            document.getElementById("email").innerText = email;
            document.getElementById("total").innerText = "$" + total;
        }
    </script>

</head>

<body onload="getParams()">

    <header class="top-bar">
        <a class="logo" href="../pages/home/home.html">
            <img src="../images/Explorlando-Logo.PNG" alt="Explorlando logo">
        </a>

        <form class="top-search" role="search">
            <input type="search" placeholder="Search..." aria-label="Search Explorlando">
        </form>

        <a href="profile.html" class="account-btn">
            <img src="../images/user-1.png" alt="Account icon">
            <span>My Account</span>
        </a>
    </header>

    <div class="app-layout">

        <!-- Left Sidebar Nav -->
        <nav class="side-nav">
            <a class="nav-item" href="login.html">Login</a>
            <a class="nav-item active" href="profile.html">Profile</a>
            <a class="nav-item" href="../aboutus.html">About Us</a>
            <a class="nav-item" href="../ms5/pages/attractions.html">Attractions</a>
            <a class="nav-item" href="../pages/open-lobby.html">Open Lobby</a>
            <a class="nav-item" href="../pages/spotlight/spotlight.html">Explorlando Spotlight</a>
            <a class="nav-item" href="../pages/for_business/for_business.html">For Businesses</a>
            <a class="nav-item" href="../ms5/pages/settings.html">Settings</a>
        </nav>

        <div class="confirmation-container">
            <div class="box">
                <h1>🎉 Order Confirmed!</h1>

                <p>Thank you for your purchase.</p>

                <p>Email: <b id="email"></b></p>
                <p>Total Paid: <b id="total"></b></p>

                <br>

                <a href="checkout.html">
                    <button>Back to Checkout</button>
                </a>
            </div>
        </div>

</body>

</html>
